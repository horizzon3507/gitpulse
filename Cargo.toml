[package]
name = "gitpulse"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Pulse-check every local git repo: dirty trees, unpushed commits, stale branches, missing remotes"
authors = ["horizzon3507 <148660626+horizzon3507@users.noreply.github.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/horizzon3507/gitpulse"
keywords = ["cli", "git", "status", "repos"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
